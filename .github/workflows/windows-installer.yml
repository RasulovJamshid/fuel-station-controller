name: Windows station installer

on:
  pull_request:
    paths:
      - 'tools/windows/**'
      - 'tools/checks/validate_config.py'
      - 'services/dispenser-service/src/main.rs'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (for example 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Installer safety tests (Windows PowerShell 5.1)
        run: ./tools/windows/tests/StationSetup.Tests.ps1
      - name: Check installer wizard compilation
        run: |
          $syntaxDir = Join-Path $env:RUNNER_TEMP 'installer-syntax'
          New-Item -ItemType Directory -Path "$syntaxDir/payload" -Force | Out-Null
          Set-Content "$syntaxDir/payload/placeholder.txt" 'Syntax check only; never distributed.'
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DPayloadDir=$syntaxDir/payload" "/DOutputDir=$syntaxDir" tools/windows/StationInstaller.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare verified bundled NSSM
        run: ./tools/windows/Get-InstallerDependencies.ps1 -Destination dist/windows-installer/dependencies
      - name: Build service
        run: |
          cargo build --locked --release -p dispenser-service
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/checks/validate_config.py target/release/dispenser-service.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build desktop
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run tauri --workspace=apps/desktop -- build --no-bundle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile offline installer
        env:
          INSTALLER_VERSION: ${{ inputs.version || '0.1.0' }}
        run: ./tools/windows/Build-Installer.ps1 -SkipBuild -Offline -BuildVersion $env:INSTALLER_VERSION
      - name: Real Windows installer and service lifecycle test (mock pumps only)
        env:
          INSTALLER_VERSION: ${{ inputs.version || '0.1.0' }}
        run: ./tools/windows/tests/WindowsIntegration.Tests.ps1 -ServiceExe target/release/dispenser-service.exe -NssmExe dist/windows-installer/dependencies/nssm.exe -InstallerExe "dist/windows-installer/AZS-Station-Setup-$env:INSTALLER_VERSION-x64.exe"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-installer-test-logs
          path: '${{ runner.temp }}/azs-integration-*/**/*.log'
      - uses: actions/upload-artifact@v4
        with:
          name: AZS-Station-Setup-x64
          if-no-files-found: error
          path: |
            dist/windows-installer/AZS-Station-Setup-*.exe
            dist/windows-installer/AZS-Station-Setup-*.exe.sha256
