user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format json escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"request_id":"$http_x_request_id"}';

    access_log /var/log/nginx/access.log json;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    server_tokens      off;          # hide nginx version

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml;

    # ── Rate-limit zones (shared memory) ─────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=500r/m;
    # Sync is keyed by API key, not IP, so we use a generic per-IP limit here;
    # finer-grained keying is done inside the NestJS app.
    limit_req_zone $binary_remote_addr zone=sync:10m  rate=300r/m;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream backend {
        server backend:4000;
        keepalive 32;
    }

    # ── Security headers applied globally ─────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                  always;
    add_header X-Frame-Options         "DENY"                     always;
    add_header X-XSS-Protection        "1; mode=block"            always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name fillingstation.ung.uz;
        return 301 https://$host$request_uri;
    }

    # ── Main server ───────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name fillingstation.ung.uz;

        # ── TLS ──────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ── Body limits ──────────────────────────────────────────────────────
        # Sync batches can be large — allow up to 10 MB.
        client_max_body_size 10m;
        client_body_timeout  60s;
        client_header_timeout 15s;

        # ── Proxy defaults ────────────────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Request-Id       $request_id;
        proxy_read_timeout  120s;
        proxy_connect_timeout 5s;
        proxy_send_timeout  60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;

        # ── Health check (no rate limit, no auth) ─────────────────────────────
        location = /api/health {
            proxy_pass http://backend;
            access_log off;
        }

        # ── Auth endpoints (strict rate limit) ────────────────────────────────
        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
        }

        # ── Sync endpoint (station-keyed, higher burst) ────────────────────────
        location /api/v1/sync/ {
            limit_req zone=sync burst=100 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
        }

        # ── WebSocket (Socket.IO) ─────────────────────────────────────────────
        # Socket.IO uses the /dashboard namespace.
        location /dashboard {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_read_timeout  3600s;   # keep WS alive for long-polling fallback
            proxy_send_timeout  3600s;
            proxy_buffering off;
        }

        # ── Swagger docs (restrict in production if desired) ──────────────────
        # Uncomment to require HTTP Basic auth on docs in prod:
        # location /api/docs {
        #     auth_basic "Restricted";
        #     auth_basic_user_file /etc/nginx/.htpasswd;
        #     proxy_pass http://backend;
        # }

        # ── General API ───────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=200 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
        }

        # ── Deny everything else ──────────────────────────────────────────────
        location / {
            return 404;
        }
    }
}
