[package]
name = "wayne-sim-desktop"
version = "0.1.0"
description = "Wayne protocol simulator control panel"
edition = "2021"

[lib]
name = "wayne_sim_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "wayne-sim-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true }
